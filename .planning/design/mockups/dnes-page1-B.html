<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Днес + навигация — посока B</title>
<link rel="stylesheet" href="_page1-common.css">
<style>
  /* B-specific: one composed screen. Masthead carries the moon as a small tappable object; the reading is opener + payoff
     (development folded behind the existing «Прочети повече»); the exit follows the payoff; only the sign beat lives below. */
  .mast{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
  .mast .moonbox{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .more{display:inline-flex;align-items:center;gap:9px;min-height:44px;margin-top:var(--r-micro);font-size:var(--t-read);line-height:var(--l-read);color:var(--starlight)}
  .more i{width:3px;height:3px;border-radius:50%;background:var(--violet);box-shadow:0 0 7px 2px rgba(139,92,246,.7)}
  .signrow{display:flex;align-items:center;gap:8px;margin-bottom:var(--r-tight)}
  .signrow svg{width:18px;height:18px;fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="root"></div>
<script src="_page1-common.js"></script>
<script src="_page1-boot.js"></script>
<script>
const B = {
  id: 'B', nav: 'B',
  title: 'Днес + навигация — посока B: „Един екран“',
  concept: `<b>Idea.</b> Today fits one screen by construction: the first viewport always holds the payoff and the lit exit. The moon moves up into the masthead as a small object (secondary, per C5) and <i>is</i> the way into the lunar profile, so the second bronze “Повече детайли” link and the whole sky section leave the scroll. The reading shows its opener and its payoff; the development paragraph (the planet-by-planet detail) folds behind the existing «Прочети повече» (today that fold only exists for outlier-length readings). <b>What answers “what do I do next”:</b> the exit is on screen at both sizes without scrolling. <b>Trade-off the founder must rule on:</b> the daily reading is no longer fully on first sight (one tap to read it all). <b>Separation without bronze caps:</b> one composed column; only the sign beat sits below, set off by group rhythm + a hairline. <b>Nav:</b> the violet horizon hairline lights above the active tab (no dot under the label).`,
  navNote: 'Nav B: same icons/labels/sizes as A; the active state is carried by the horizon: the violet hairline brightens in a 56 px segment directly over the active tab (colour + glow + position, R7), plus label starlight. Press = opacity .6 + scale .94. No bronze anywhere in the bar.',
  motion: `<h3>Motion spec (opacity + transform only; reduced motion = instant, no loop)</h3><table class="t"><tr><th>Moment</th><th>Spec</th></tr>
   <tr><td>Reading arrives</td><td>opener + payoff block: opacity 0→1 + translateY 6→0, 600 ms ease-out, <b>once</b>; the masthead moon resolves with opacity only (700 ms)</td></tr>
   <tr><td>Exit</td><td>opacity 0→1, 500 ms, +500 ms after the reading; ember breathes 2.6 s (the only loop)</td></tr>
   <tr><td>«Прочети повече»</td><td>the folded paragraph opens in place: height + opacity 250 ms ease-out; content below moves down, nothing above moves</td></tr>
   <tr><td>Loading → arrival</td><td>stage block cross-fades out 200 ms while the reading fades in</td></tr>
   <tr><td>Stage lines / glyph light</td><td>0 / 1.5 / 3.0 s with the placement lighting together (colour + glow + label); slow line at 10 s</td></tr>
   <tr><td>Tab switch</td><td>content cross-fade 200 ms; the horizon segment slides to the new tab in 150 ms</td></tr>
   <tr><td>First open after reveal</td><td>as arrival; the Ти icon’s sign glyph lights once</td></tr>
   <tr><td>Reduced motion</td><td>every transition is an instant state change; ember static at full opacity</td></tr></table>`,

  render(s, ctx) {
    const C = P1.C, R = P1.READING
    const long = s === 'stress'
    const anim = ctx.anim
    const phase = C(long ? 'phaseLong' : 'phase')
    const mast = `<div class="mast"><div class="cap tnum" style="flex:1 1 auto">${C(long ? 'dateLong' : 'date')}</div>
        <div class="moonbox ${anim ? 'm-moon' : ''}"><span class="cap m" style="white-space:nowrap">${phase}</span>${P1.moon(40, { tap: true })}</div></div>
      <div class="read mu" style="margin-top:var(--r-micro)">${C(long ? 'greetLong' : 'greet')}</div>`
    const notice = (id) => `<div class="cap m" style="margin-top:var(--r-tight)">${C(id)}</div>`
    const reading = () => `<div data-reading class="${anim ? 'm-read' : ''}">
        <p class="read" style="margin:0">${R.p1}</p>
        <div class="more"><i></i>${C('readMore')}</div>
        <div class="payoff" style="margin-top:var(--r-para)"><div class="glow"></div><span class="t">${R.pay}</span></div>
      </div>
      <div class="cap ${anim ? 'm-exit' : ''}" style="margin-top:var(--r-micro)">${C('disclose')}</div>`
    const exit = (label, o) => `<div style="margin-top:var(--r-tight)">${P1.exitLit(label, { anim, ...o })}</div>`
    const below = () => `<div class="hair"></div><div class="${anim ? 'm-rest' : ''}"><div class="signrow">${P1.glyph('libra')}<span class="cap m">${C('signName')}</span></div><p class="read mu" style="margin:0">${C('quip')}</p>${long ? `<p class="read mu" style="margin:var(--r-para) 0 0">${C('meteor')}</p>` : ''}</div>`
    switch (s) {
      case 'normal': case 'scrolled': case 'stress':
        return mast + `<div style="margin-top:var(--r-tight)">${reading()}</div>` + exit(C('cta')) + below()
      case 'load0': case 'load1': case 'load2': case 'loadslow':
        return mast + P1.loading(s === 'load0' ? 0 : s === 'load1' ? 1 : 2, s === 'loadslow')
      case 'fail':
        return mast + `<p class="read" style="margin:var(--r-group) 0 0">${C('unavail')}</p>` + exit(C('retry'), { neutral: true }) + below()
      case 'offcached':
        return mast + notice('offNote') + `<div style="margin-top:var(--r-tight)">${reading()}</div>` + exit(C('retry'), { neutral: true }) + below()
      case 'offnone':
        return mast + `<p class="read" style="margin:var(--r-group) 0 0">${C('offNone')}</p>` + exit(C('retry'), { neutral: true }) + below()
      case 'regencap':
        return mast + `<div style="margin-top:var(--r-para)" data-reading><div style="border-left:2px solid rgba(139,92,246,.35);padding-left:16px"><p class="read" style="margin:0">${C('capFallback')}</p></div><p class="read mu" style="margin:var(--r-para) 0 0">${C('cap')}</p></div>` + exit(C('cta')) + below()
      case 'empty':
        return mast + `<p class="read" style="margin:var(--r-group) 0 0">${C('emptyBody')}</p>` + exit(C('emptyCta'), { neutral: true })
    }
    return ''
  },
}
bootPage1(B)
</script>
</body>
</html>
