name: Post-deploy smoke

# Fires when Vercel reports a deployment finished. We run the smoke script
# only for a SUCCESSFUL PRODUCTION deployment — preview deploys and failed
# ones are skipped by the job-level `if`.
#
# Why deployment_status and not a Vercel cron: this needs to assert that the
# smoke run hit the build that was just deployed (X-Deploy-SHA response
# header == the deployed commit). A time-based cron cannot know which deploy
# it is testing. Continuous uptime monitoring is a separate concern and is
# not this workflow.
#
# SHA SOURCE: in the `deployment_status` webhook payload the commit is
# `github.event.deployment.sha` — the `deployment` object. The
# `deployment_status` object has NO `sha` field, so
# `github.event.deployment_status.sha` silently resolves to "" (this bit us
# on the first run — checkout still worked only because an empty `ref:`
# falls back to `github.sha`, which for this event IS the deployed commit).
# `github.sha` is kept as an explicit fallback.
on:
  deployment_status: {}

jobs:
  smoke:
    # deployment_status.environment is "Production" / "Preview" (Vercel).
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run smoke checks
        run: node scripts/smoke.mjs
        env:
          # PREFER the repo variable SMOKE_BASE_URL (set to the canonical,
          # unprotected production domain). `environment_url` is the raw
          # *.vercel.app deployment URL, which sits behind Vercel Deployment
          # Protection and answers every unauthenticated request with an SSO
          # HTML page — so it is only a last-resort fallback.
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || github.event.deployment_status.environment_url }}
          SMOKE_EXPECTED_SHA: ${{ github.event.deployment.sha || github.sha }}
          SMOKE_SECRET: ${{ secrets.SMOKE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Set to "1" in repo variables to skip the paid Gemini call.
          SMOKE_SKIP_AI: ${{ vars.SMOKE_SKIP_AI }}
          # Not a secret — must equal apps/web's own NEXT_PUBLIC_POSTHOG_HOST
          # Vercel env var (currently https://eu.i.posthog.com) so the CSP
          # connect-src check (CSP-SMOKE-CHECK) verifies against the real
          # deployed value instead of a hardcoded guess.
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
