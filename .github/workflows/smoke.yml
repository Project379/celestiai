name: Post-deploy smoke

# Fires when Vercel reports a deployment finished. We run the smoke script
# only for a SUCCESSFUL PRODUCTION deployment — preview deploys and failed
# ones are skipped by the job-level `if`.
#
# Why deployment_status and not a Vercel cron: this needs to assert that the
# smoke run hit the build that was just deployed (X-Deploy-SHA ==
# deployment_status.sha). A time-based cron cannot know which deploy it is
# testing. Continuous uptime monitoring is a separate concern and is not
# this workflow.
on:
  deployment_status: {}

jobs:
  smoke:
    # deployment_status.environment is "Production" / "Preview" (Vercel).
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment_status.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run smoke checks
        run: node scripts/smoke.mjs
        env:
          # environment_url is the exact deployment; fall back to the repo
          # variable SMOKE_BASE_URL (set to the canonical domain) if Vercel
          # didn't populate it.
          SMOKE_BASE_URL: ${{ github.event.deployment_status.environment_url || vars.SMOKE_BASE_URL }}
          SMOKE_EXPECTED_SHA: ${{ github.event.deployment_status.sha }}
          SMOKE_SECRET: ${{ secrets.SMOKE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Set to "1" in repo variables to skip the paid Gemini call.
          SMOKE_SKIP_AI: ${{ vars.SMOKE_SKIP_AI }}
