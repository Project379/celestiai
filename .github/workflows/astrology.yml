name: Astrology Validation

# Runs the @stellaeum/astrology §9 validation harness as a CI regression gate.
# See `.planning/phases/09-ephemeris-validation/09-06-CI-INTEGRATION.md` for
# scope and design rationale.
#
# Triggers:
#   - pull_request to main when astrology files change
#   - push to main when astrology files change (direct pushes and
#     short-lived branches merging back both land here — single-branch
#     strategy since 2026-08-04, see HANDOFF-2026-05-09.md)
#
# Path filter scoped to packages/astrology/** + this workflow file. Changes
# outside the astrology package do not fire this workflow; typecheck-level
# regressions in downstream consumers (apps/web) are covered by the existing
# ci.yml workflow's `check:all` step.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/astrology/**'
      - '.github/workflows/astrology.yml'
  push:
    branches: [main]
    paths:
      - 'packages/astrology/**'
      - '.github/workflows/astrology.yml'

jobs:
  validation:
    name: §9 ephemeris validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck @stellaeum/astrology (src + test)
        run: pnpm --filter @stellaeum/astrology typecheck

      - name: Run §9 validation harness (39 tests across 12 cases)
        run: pnpm --filter @stellaeum/astrology test
